[project]
name = "agent-trx-classifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "docling>=2.130.0",
  "langchain>=1.2,<2",
  "langchain-openrouter>=0.1,<1",
  "openrouter>=0.10,<1",
  "langgraph>=1.1,<2",
  "langsmith>=0.7,<1",
  "typesafe-sdk>=0.7.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "torch>=2.11,<3",
  "torchvision>=0.26,<1",
  "supabase>=2.20,<3",
  "google-auth>=2.40,<3",
  "google-cloud-tasks>=2.19,<3",
  "google-cloud-storage>=3,<4",
]

[project.scripts]
trx-classify = "cli.main:main"
trx-api = "api.main:main"
trx-dataset = "evaluations.evaluation.dataset:main"
trx-evaluate = "evaluations.evaluation.runner:main"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evaluations = ["dataset/*.json", "dataset/fixtures/*.pdf"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
